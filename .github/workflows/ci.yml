name: CI

# CI now runs LOCALLY on a self-hosted VM via `act` (GitHub-hosted minutes are exhausted).
# The two jobs below are reproduced by `npm run gate:full` (act -j checks ‖ act -j smoke) and
# enforced on every push by the `.husky/pre-push` fast gate. See docs/CI-LOCAL-VM.md.
#
# Kept as `workflow_dispatch` so the workflow stays valid + act can drive it, while GitHub spends
# no minutes on push/PR. To restore automatic GitHub-hosted runs, re-add:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:placeholders # block new TODO/FIXME/placeholder leakage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test # vitest: EN/ES key parity + zod lead schema
      - run: npm run build
      - run: npm run bundle:report

  smoke:
    name: playwright smoke (routes · no-JS · reduced-motion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server and run smoke
        run: |
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/en > /dev/null && break; sleep 1; done
          npm run test:smoke
